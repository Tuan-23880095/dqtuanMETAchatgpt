<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>AI Workspace - Trợ lý cục bộ</title>
    <link rel="icon" type="image/png" href="logo.png">
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 0; 
            background: linear-gradient(135deg, #e0f2f1, #b2dfdb); 
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .chat-container { 
            width: 100%; 
            max-width: 700px; 
            height: 90vh;
            background: #ffffff; 
            border-radius: 15px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.15); 
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .header {
            background: #00796b;
            color: white;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            font-size: 1.2rem;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .header img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin-right: 15px;
            background: white;
            padding: 2px;
        }
        .chat-box { 
            flex: 1; 
            overflow-y: auto; 
            padding: 20px; 
            background: #fafafa;
        }
        .message { 
            margin: 10px 0; 
            padding: 12px 16px; 
            border-radius: 12px; 
            max-width: 80%; 
            line-height: 1.5;
            word-wrap: break-word;
        }
        .user { 
            background: #4db6ac; 
            color: white; 
            margin-left: auto; 
            border-bottom-right-radius: 2px;
        }
        .bot { 
            background: #e0e0e0; 
            color: #333; 
            margin-right: auto; 
            border-bottom-left-radius: 2px;
        }
        .input-area { 
            display: flex; 
            padding: 15px; 
            background: #ffffff;
            border-top: 1px solid #eee;
        }
        #user-input { 
            flex: 1; 
            padding: 12px; 
            border: 1px solid #ccc; 
            border-radius: 25px; 
            margin-right: 10px; 
            font-size: 1rem;
            outline: none;
            transition: border 0.3s;
        }
        #user-input:focus {
            border-color: #00796b;
        }
        button { 
            padding: 12px 24px; 
            border: none; 
            background: #00796b; 
            color: white; 
            border-radius: 25px; 
            cursor: pointer; 
            font-size: 1rem;
            font-weight: bold;
            transition: background 0.3s;
        }
        button:hover { 
            background: #004d40; 
        }
        .typing {
            font-style: italic;
            color: #888;
            font-size: 0.9rem;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="header">
            <img src="logo.png" alt="Logo">
            META ChatGPT - Cục Bộ
        </div>
        <div id="chat-box" class="chat-box">
            <div class="message bot">Xin chào! Tôi là trợ lý AI (Qwen3) đang chạy trực tiếp trên GPU máy tính của bạn. Tôi có thể giúp gì cho bạn hôm nay?</div>
        </div>
        <div class="input-area">
            <input type="text" id="user-input" placeholder="Nhập tin nhắn... (Dùng @basau /tên-skill để gọi trợ lý)" autocomplete="off">
            <button onclick="sendMessage()">Gửi</button>
        </div>
    </div>
    <script>
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');

        userInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendMessage();
        });

        async function sendMessage() {
            const userMsg = userInput.value.trim();
            if (!userMsg) return;

            appendMessage('user', userMsg);
            userInput.value = '';

            const loadingId = 'loading-' + Date.now();
            appendMessage('bot', 'Đang suy nghĩ...', loadingId);

            try {
                const res = await fetch('http://localhost:5000/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: userMsg })
                });
                const data = await res.json();
                document.getElementById(loadingId).remove();
                appendMessage('bot', data.reply);
            } catch (err) {
                document.getElementById(loadingId).remove();
                appendMessage('bot', "Lỗi kết nối tới AI cục bộ! Đảm bảo bạn đã chạy 'python app.py' nhé.");
            }
        }

        function appendMessage(type, text, id = null) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${type}`;
            msgDiv.textContent = text;
            if (id) msgDiv.id = id;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
